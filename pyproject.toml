[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illumio-flow-mapper"
version = "0.1.0"
description = "Turn Illumio traffic flows into application architecture graphs, with a LangGraph agent on top"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "networkx>=3.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.5",
  "httpx>=0.27",
  "langchain>=1.0",
  "langgraph>=1.0",
  "langchain-anthropic>=1.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.45"]

[project.scripts]
flowmapper = "flowmapper.cli:main"

[tool.setuptools.packages.find]
include = ["flowmapper*"]

[tool.setuptools.package-data]
flowmapper = ["api/static/*", "api/static/vendor/*"]

[tool.ruff]
line-length = 160
target-version = "py311"
